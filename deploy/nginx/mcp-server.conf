# MySQL MCP Server —— 反向代理 + API Key 认证（生产参考，Linux）
# 设计：MCP Server 无内置认证 → 网关认证（与 designcomputer 建议一致）。
#       认证后无状态代理到后端，后端可水平扩展多个实例（upstream）。
# 密钥管理：/etc/nginx/mcp_keys.conf 仅 root 可读，内容形如：
#   map $http_authorization $mcp_auth_ok {
#       default 0;
#       "Bearer sk-prod-xxx" 1;
#   }
# 本地开发（Windows）无需本文件：直接连 127.0.0.1:8000。

#upstream mcp_servers {
#    server 127.0.0.1:8000;
#    server 127.0.0.1:8001;   # 水平扩展：多实例
#}

server {
    listen 443 ssl;
    server_name mcp.example.com;

    ssl_certificate     /etc/nginx/ssl/mcp.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/mcp.example.com.key;
    # HTTPS：传输加密（安全要求）

    include /etc/nginx/mcp_keys.conf;

    location /mcp {
        # API Key 认证：Authorization: Bearer <key> 校验失败返回 401
        if ($mcp_auth_ok != 1) {
            return 401;
        }
        proxy_pass http://mcp_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # streamable-http 需关闭缓冲，事件流即时转发
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }
}
